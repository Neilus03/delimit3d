# Resolved contract for the first Sonata short adaptation.
# Before a GPU preflight, export the two data variables below on Euler.  They
# must point to audited Delimit3D source-manifest scenes and the corresponding
# deterministic training split; the raw Structured3D zip directory is not a
# valid source_root.
experiment:
  name: delimit3d_sonata_rgbn6_256_v1
  seed: 20260911
  updates: 256
  checkpoint_updates: [64, 128, 256]
  claim_boundary: >-
    256-update label-free adaptation of public Sonata features to
    multigranular Structured3D 2D pseudomasks; no downstream claim is made by
    this training job alone.

model:
  family: sonata
  sonata_root: /cluster/work/igp_psr/nedela/sonata
  source_commit: 18c09ff8d713494f78a8213792262b910977a65d
  checkpoint: /cluster/work/igp_psr/nedela/sonata_weights/sonata.pth
  checkpoint_sha256: c5ced5acdae30d1c469713398073a866e25e6e414e23feed5dc025373657ac50
  input_contract: coord_rgb_normal_9ch_official_sonata_v1
  grid_size: 0.02
  enable_flash: true
  patch_size: 1024
  projection_dim: 128
  projection_hidden_dim: 128

# These variables are intentionally explicit.  Set them in the Euler shell or
# replace them in a copied resolved config; prepare mode does not invent paths.
data:
  source_root: ${DELIMIT3D_STRUCTURED3D_SOURCE_ROOT}
  train_split: ${DELIMIT3D_STRUCTURED3D_TRAIN_SPLIT}
  coordinate_normalization_policy: structured3d_local_y_up_to_scannet_z_up_v1
  source_cells: [2d/g02, 2d/g05, 2d/g08]
  source_manifest_verification: sha256_required
  augmentation_profile: none

sampling:
  mode: coverage_multigranular_v2
  profile: pf_hnm_512_v1
  source_cells: [2d/g02, 2d/g05, 2d/g08]
  negative_membership_policy: require_negative_proposal_membership
  feature_hard_mining: enabled

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 0.1

paths:
  output: /cluster/work/igp_psr/nedela/delimit3d_sonata_rgbn6_256_v1
