encoder:
  name: Delimit3D-trained LitePT-S*
  checkpoint: /cluster/work/igp_psr/nedela/public_rgbn6_frozen_pg_20260907_r1/results/posttraining_256_r4/checkpoints/audit_e0001_u00000256.pt
  checkpoint_sha256: 4717369861cff81fe784efda8cd8a7653de46d35635730f10c893da563050282
  trainable: true
  label_supervision: official ScanNet40 train instances

protocol:
  train_updates: 5000
  click_budget: 20
  click_center_method: kdtree
  clicked_point_included: true
  active_litept_level: dec0
  voxel_size_m: 0.02
  voxel_reduce: representative
  representative_sampling: first
  representative_preflight_arithmetic: pytorch_2.4.1_cuda_float32_scalar_reciprocal
  rgbn6_contract: RGB followed by unit normals; center XY and ground Z
  train_scene_selection: exact_parent_1200_scene_schedule
  initial_click_policy: deepest error region; paired deterministic shuffled object order
  correction_policy: one global deepest error click including background; no per-label cap

decoder:
  init_seed: 20260912
  feature_dim: 72
  hidden_dim: 128
  num_heads: 8
  dim_feedforward: 1024
  num_decoders: 3
  num_bg_queries: 10
  dropout: 0.0
  pre_norm: false
  max_click_events: 200
  normalize_pos_enc: true
  gauss_scale: 1.0
  aux: true

optimizer:
  learning_rate: 0.0001
  encoder_lr: 0.0001
  decoder_lr: 0.0001
  weight_decay: 0.0001
  clip_norm: 0.1
  batch_size: 1
  gpu: RTX 4090
  gpu_count: 1
  cpus_per_process: 8
  host_ram_gib: 64
  cache_memory_scenes: 2

precision:
  amp: true
  dtype: float16
  initial_scale: 1.0
  growth_interval: 1000000

runtime:
  startup_gradient_check: false
  heartbeat_seconds: 30

loss:
  bce_weight: 1.0
  dice_weight: 2.0
  alpha: 0.8
  beta: 2.0
  radius: 0.3

evaluation:
